[project]
name = "bedrock-ingest"
version = "0.1.0"
description = "Ingest data into the bedrock's RustFS buckets with dlt: one job, one source, one bucket."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datacontract-cli[csv,duckdb]>=1.2.4",
    "dlt[s3]>=1.31.0",
    "pyyaml>=6.0",
]

[project.scripts]
ingest = "bedrock_ingest.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.6.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# D = pydocstyle: the numpy convention is enforced, not just aspired to.
select = ["F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
